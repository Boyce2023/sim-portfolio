<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高标首阴盘感刷题机 · V5.1 第1套50题</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
}
body {
    background-color: #f3f4f6;
    color: #111827;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 16px;
}
.container {
    max-width: 1440px;
    margin: 0 auto;
}

/* 顶部导航与全局战绩 */
.top-header {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-bottom: 2px solid #111827;
    padding: 12px 18px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
.brand-title {
    font-size: 17px;
    font-weight: 800;
    color: #111827;
    display: flex;
    align-items: center;
    gap: 8px;
}
.brand-tag {
    background: #111827;
    color: #ffffff;
    font-size: 11px;
    padding: 2px 6px;
    font-weight: 700;
}
.stats-summary {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
}
.stat-pill {
    display: flex;
    flex-direction: column;
}
.stat-label {
    color: #6b7280;
    font-size: 10px;
}
.stat-val {
    font-weight: 800;
    font-family: monospace;
    font-size: 14px;
}

/* 工具栏与控制栏 */
.toolbar {
    background: #ffffff;
    border: 1px solid #d1d5db;
    padding: 10px 16px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}
.toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.toolbar-btn {
    background: #f9fafb;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.toolbar-btn:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
}
.toolbar-btn.primary {
    background: #111827;
    color: #ffffff;
    border-color: #111827;
}
.toolbar-btn.primary:hover {
    background: #374151;
}
.mode-select {
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #d1d5db;
    background: #ffffff;
    outline: none;
}
.jump-input {
    width: 55px;
    padding: 4px 6px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #d1d5db;
    text-align: center;
}

/* 关卡横幅与大盘趋势胶囊 */
.case-banner {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-left: 4px solid #111827;
    padding: 12px 18px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}
.case-title {
    font-size: 16px;
    font-weight: 800;
    color: #111827;
    margin-bottom: 3px;
}
.case-sub {
    font-size: 12px;
    color: #4b5563;
}
.case-phase-pill {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

/* 主面板网格与黑底模块方标 */
.section-card {
    background: #ffffff;
    border: 1px solid #d1d5db;
    padding: 14px;
    margin-bottom: 14px;
}
.section-header {
    font-size: 13px;
    font-weight: 800;
    color: #111827;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.module-tag {
    background: #111827;
    color: #ffffff;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 700;
    display: inline-block;
}

/* 模块一：前6个月大势 + 前30日短线 + 昨日情绪 三栏并排 (38% : 36% : 26%) */
.grid-module-1 {
    display: grid;
    grid-template-columns: 38fr 36fr 26fr;
    gap: 12px;
}
.sentiment-metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}
.sentiment-metrics-table td {
    padding: 5px 8px;
    border-bottom: 1px solid #e5e7eb;
}
.sentiment-label {
    color: #4b5563;
    font-weight: 600;
}
.sentiment-value {
    font-family: monospace;
    font-weight: 800;
    text-align: right;
    font-size: 12px;
}
.red { color: #dc2626 !important; }
.green { color: #16a34a !important; }
.gold { color: #d97706 !important; }

/* 板块归属标签（严谨区分沪深主板10%与双创20%） */
.plate-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    margin-left: 5px;
    white-space: nowrap;
    display: inline-block;
    vertical-align: middle;
}
.plate-sh {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}
.plate-sz {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}
.plate-cyb {
    background: #f5f3ff;
    color: #7c3aed;
    border: 1px solid #ddd6fe;
}
.plate-kcb {
    background: #fff7ed;
    color: #c2410c;
    border: 1px solid #ffedd5;
}
.plate-bj {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
}

/* 模块二：3 张题材卡 */
.themes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}
.theme-card {
    background: #ffffff;
    border: 1px solid #d1d5db;
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
}
.theme-card:hover {
    border-color: #9ca3af;
    background: #fafafa;
}
.theme-card.selected {
    border: 2px solid #111827 !important;
    background: #fcfcfd;
}

/* 模块三：K 线图网格与表格 */
.kline-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
}
.stock-kline-card {
    background: #ffffff;
    border: 1px solid #d1d5db;
}
.stock-code-tag {
    background: #111827;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 6px;
    display: inline-block;
}

/* 表格：水平细线，零竖线 */
.stocks-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    background: #ffffff;
}
.stocks-table th {
    background: #f9fafb;
    border-top: 1px solid #d1d5db;
    border-bottom: 1px solid #111827;
    padding: 7px 7px;
    text-align: left;
    font-weight: 700;
    color: #374151;
    white-space: nowrap;
}
.stocks-table td {
    border-bottom: 1px solid #e5e7eb;
    padding: 7px 7px;
    vertical-align: middle;
}
.stocks-table tr:hover td {
    background: #f9fafb;
}

/* 模块四：作答按钮 */
.action-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 12px;
}
.choice-btn {
    background: #ffffff;
    border: 1px solid #d1d5db;
    padding: 12px 10px;
    font-size: 13px;
    font-weight: 800;
    color: #111827;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
}
.choice-btn:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
}
.choice-btn.selected-choice {
    background: #111827 !important;
    color: #fde68a !important;
    border-color: #111827 !important;
}
.choice-btn.btn-empty {
    border-left: 3px solid #d97706;
}

/* 模块五：揭晓复盘卡 */
.result-card {
    background: #ffffff;
    border: 1px solid #d1d5db;
    margin-top: 14px;
}
.result-header {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.postmortem-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 14px;
}

/* 锁屏界面样式 */
.lock-screen-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}
.lock-card {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-top: 4px solid #111827;
    padding: 36px 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}
.lock-title {
    font-size: 18px;
    font-weight: 800;
    color: #111827;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.lock-desc {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 20px;
}
.lock-input {
    width: 100%;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #d1d5db;
    margin-bottom: 12px;
    font-family: monospace;
    outline: none;
}
.lock-input:focus {
    border-color: #111827;
}
.lock-btn {
    width: 100%;
    background: #111827;
    color: #ffffff;
    border: none;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}
.lock-btn:hover {
    background: #374151;
}
</style>
</head>

// 高标首阴 V5.1 盘感刷题机前端（独立文件，复用 astock2 样式与口令外壳）
function initTrainerApp(DATA) {
  const KEY = (window.HIGH_STATS_KEY || 'high_v51') + '_progress';
  let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  let cur = 0; const root = document.getElementById('high-app');
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const col = v => v > 0 ? '#dc2626' : (v < 0 ? '#16a34a' : '#6b7280');
  const fr = v => (v > 0 ? '涨' : (v < 0 ? '跌' : '')) + Math.abs(v).toFixed(2) + '%';
  function stats() {
    let n = 0, ok = 0, my = 1, sy = 1;
    DATA.forEach(q => { const a = st[q.id]; if (!a) return; n++; if (a.pick === q.ans) ok++;
      const c = q.cands.find(x => x.opt === a.pick); my *= 1 + (c ? c.ret : 0) / 100; sy *= 1 + q.sys_ret / 100; });
    return { n, ok, my, sy };
  }
  function drawK(cv, ks) {
    const ctx = cv.getContext('2d'), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    let hi = -1e9, lo = 1e9; ks.forEach(k => { hi = Math.max(hi, k[1]); lo = Math.min(lo, k[2]); });
    const y = v => H - 6 - (v - lo) / ((hi - lo) || 1) * (H - 12), w = W / ks.length;
    ks.forEach((k, i) => { const up = k[3] >= k[0], x = i * w + w / 2, last = i === ks.length - 1;
      ctx.strokeStyle = ctx.fillStyle = last ? '#2563eb' : (up ? '#dc2626' : '#16a34a');
      ctx.beginPath(); ctx.moveTo(x, y(k[1])); ctx.lineTo(x, y(k[2])); ctx.stroke();
      const t = y(Math.max(k[0], k[3])), b = y(Math.min(k[0], k[3]));
      ctx.fillRect(x - w * 0.35, t, w * 0.7, Math.max(1.5, b - t)); });
  }
  function render() {
    const q = DATA[cur], a = st[q.id], s = stats();
    let h = `<div class="hd-top"><b>${window.HIGH_TITLE || '高标首阴盘感刷题机'}</b>
      <span>已答 ${s.n}/${DATA.length}</span><span>答对 ${s.ok}</span>
      <span>你的累计 <b style="color:${col(s.my - 1)}">${fr((s.my - 1) * 100)}</b></span>
      <span>量化规则累计 <b style="color:${col(s.sy - 1)}">${fr((s.sy - 1) * 100)}</b></span></div>
      <div class="hd-q"><h3>第${q.id}题 · ${q.title}</h3>
      <div class="hd-mk">昨日全场涨停 ${q.n_zt} 家 · 断板日全场最高连板 ${q.max_b} 板 · 沪深300近5日${q.csi5} · K线最右蓝线为今日开盘价</div>
      <div class="hd-tip">现在是09:25竞价刚结束。下面是今天断板首阴的高标，你买哪只，还是空仓？</div>`;
    q.cands.forEach(c => {
      h += `<div class="hd-card"><div class="hd-name">${c.opt}. ${c.name} <small>${c.code}</small> · ${c.height}连板后首次断板</div>
        <canvas id="k_${c.opt}" width="520" height="150" class="hd-k"></canvas>
        <div class="hd-grid"><span>断板日收${c.d1}</span><span>断板日开盘${c.d1_open}</span><span>断板日换手${c.turn}</span>
        <span>十大股东锁仓${c.lock}</span><span>真实自由流通${c.fmcap}</span><span>今日竞价<b>${c.auction}</b></span>
        <span>监管函：${c.reg ? '<b style="color:#dc2626">有</b>' : '无'}</span><span>龙虎榜拉萨席位${c.lhasa}家</span></div>`;
      if (a) h += `<div class="hd-res" style="border-color:${col(c.ret)}">规则判断：${c.why}<br>
        实际结果：${c.filled || c.opt === q.ans ? c.exit + '，净收益 <b style="color:' + col(c.ret) + '">' + fr(c.ret) + '</b>（扣千分之二手续费）' : c.exit}</div>`;
      h += `</div>`;
    });
    h += `<div class="hd-btns">` + q.cands.map(c => `<button class="toolbar-btn${a && a.pick === c.opt ? ' primary' : ''}" data-p="${c.opt}">买 ${c.opt}. ${c.name}</button>`).join('') +
      `<button class="toolbar-btn${a && a.pick === '空仓' ? ' primary' : ''}" data-p="空仓">空仓不买</button></div>`;
    if (a) {
      const ac = q.ans === '空仓' ? '空仓' : q.ans + '. ' + q.cands.find(c => c.opt === q.ans).name;
      h += `<div class="hd-ans ${a.pick === q.ans ? 'ok' : 'bad'}">${a.pick === q.ans ? '答对了' : '和规则不一样'}。高标 V5.1 规则的选择：<b>${ac}</b>，规则当天收益 <b style="color:${col(q.sys_ret)}">${fr(q.sys_ret)}</b></div>`;
    }
    h += `</div><div class="hd-nav"><button class="toolbar-btn" id="hd-prev">上一题</button>
      <select id="hd-jump">${DATA.map((x, i) => `<option value="${i}"${i === cur ? ' selected' : ''}>第${x.id}题 ${x.date}${st[x.id] ? ' 已答' : ''}</option>`).join('')}</select>
      <button class="toolbar-btn" id="hd-next">下一题</button><button class="toolbar-btn" id="hd-reset">清空记录</button></div>`;
    if (s.n === DATA.length) h += `<div class="hd-ans ok">全部答完：你答对 ${s.ok}/${DATA.length}，你的累计 ${fr((s.my - 1) * 100)}，规则累计 ${fr((s.sy - 1) * 100)}。</div>`;
    root.innerHTML = h;
    q.cands.forEach(c => drawK(document.getElementById('k_' + c.opt), c.klines));
    root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (!st[q.id]) { st[q.id] = { pick: b.dataset.p }; save(); render(); } });
    document.getElementById('hd-prev').onclick = () => { if (cur > 0) { cur--; render(); } };
    document.getElementById('hd-next').onclick = () => { if (cur < DATA.length - 1) { cur++; render(); } };
    document.getElementById('hd-jump').onchange = e => { cur = +e.target.value; render(); };
    document.getElementById('hd-reset').onclick = () => { if (confirm('确定清空全部答题记录？')) { st = {}; save(); render(); } };
  }
  render();
}
